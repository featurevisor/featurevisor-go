name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21.x", "1.26.x"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Test SDK
        run: go test -race ./...

      - name: Build CLI
        run: make build

  openfeature:
    name: OpenFeature provider
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            openfeature/go.sum

      - name: Test provider
        run: make test-openfeature

      - name: Verify module boundaries
        run: make verify-packages

  example:
    name: Featurevisor example-1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Set up Featurevisor example-1 project
        run: |
          mkdir example-1
          cd example-1
          npx --yes @featurevisor/cli@latest init --example=1
          npm install
          npx featurevisor build
          npx featurevisor test --onlyFailures

      - name: Run example-1 through Go SDK
        run: go run ./cmd/main.go test --projectDirectoryPath=./example-1 --onlyFailures
